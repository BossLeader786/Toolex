name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # Actions tab -> "Run workflow" -> APK artifact

permissions:
  contents: write           # needed to attach the APK to a GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners ship with an Android SDK; reuse it (avoids a flaky setup step).
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests: page math, size parsing, name sanitising, ladder ordering.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Bytecode/target-safety net: `javac` rejects Java-8-style references to
      # Android APIs introduced after minSdk 24 (Kotlin 2.x no longer errors on
      # those), so a release build catches accidental new-API usage.
      - name: Verify release bytecode (no APIs above minSdk)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Run JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee gradle.log | tail -n 60

      # The Actions log download endpoint is not reachable from every network,
      # so mirror the diagnostics into a commit comment (readable via the API).
      - name: Post failure details to the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request

          try:
              raw = open("gradle.log", errors="replace").read()
          except FileNotFoundError:
              raw = "gradle.log not produced (failure happened before Gradle ran)"

          pattern = re.compile(
              r"(^e: |error:|^FAILED|What went wrong|Caused by|Execution failed|> Task .*FAILED|"
              r"Unresolved reference|Type mismatch|Only safe \(|Cannot access)"
          )
          lines = [l for l in raw.splitlines() if pattern.search(l)]
          body = "\n".join(lines)[-55000:] or raw[-55000:]
          payload = {"body": "### CI diagnostics\n```\n" + body + "\n```"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/commits/{os.environ['GH_SHA']}/comments",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req)
          print("diagnostics posted")
          PYEOF

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Engine verification: a 1:1 Python port is checked against the original
  #    Flask maths + real PDFs are read back with pypdf.
  # ---------------------------------------------------------------------------
  verify-engine:
    name: Verify PDF engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pypdf Pillow

      - name: Geometry + PDF structure checks
        run: python3 tools/verify_pdf.py

  # ---------------------------------------------------------------------------
  # 3. Build the installable APK and keep it as a run artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build debug APK
    needs: [test, verify-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk "artifacts/Toolex-${GITHUB_REF_NAME}-debug.apk"
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: toolex-debug-apk
          path: artifacts/*.apk
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 4. Tag push (v1.0.0 ...) -> public GitHub Release with the APK attached,
  #    so the phone can install it with one tap from the Releases page.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolex-debug-apk
          path: artifacts

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Toolex ${GITHUB_REF_NAME}" \
            --notes "Images → PDF, offline. Install the APK below (allow \"install from unknown sources\" once)." \
            --latest
