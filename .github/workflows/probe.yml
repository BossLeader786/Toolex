name: CI probe

on:
  push:
    branches: ["ci-probe"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apt:
    name: APK apt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Assemble debug with full log
        shell: bash
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          echo "exit=$?"
          tail -30 build.log

      - name: Post diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request
          raw = open("build.log", errors="replace").read() if os.path.exists("build.log") else "no log"
          lines = raw.splitlines()
          keep = [f"{i}: {l}" for i, l in enumerate(lines)
                  if re.search(r"(What went wrong|Caused by:|Execution failed|FAILED|error:|^e: |daemon|OutOfMemory|License|license|Sdk|sdk|not found|No such)", l)]
          body = "\n".join(keep)[-30000:] or "(nothing matched)"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/commits/{os.environ['GH_SHA']}/comments",
              data=json.dumps({"body": "### apt-check\n```\n" + body + "\n```"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("posted")
          PYEOF
