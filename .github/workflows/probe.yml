name: CI probe

on:
  push:
    branches: ["ci-probe"]
  workflow_dispatch:

permissions:
  contents: write           # commit comments for diagnostics

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners ship with an Android SDK; reuse it (avoids a flaky setup step).
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  # ---------------------------------------------------------------------------
  # 0. Probe: try several ways to obtain a working Android SDK on the runner
  #    (the preinstalled SDK is not usable for every AGP version) and print a
  #    verdict through a commit comment, which is readable without log access.
  # ---------------------------------------------------------------------------
  probe:
    name: SDK probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Probe SDK + toolchain
        shell: bash
        run: |
          set -x
          LOG=probe.log
          exec > >(tee -a "$LOG") 2>&1
          echo "== env"; env | grep -iE "android|java_home|sdk" | sort
          echo "== preinstalled sdk dirs"; ls -d /usr/local/lib/android/sdk 2>/dev/null; ls /usr/local/lib/android/sdk 2>/dev/null | head
          echo "== sdkmanager"; ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/ 2>/dev/null | head
          for d in /usr/local/lib/android/sdk /usr/local/lib/android/sdk/cmdline-tools/latest; do echo "dir=$d"; done
          echo "== gradle wrapper (downloads gradle from services.gradle.org)"
          ls -l gradlew; head -3 gradlew
          ./gradlew --version 2>&1 | tail -20
          echo "== which java"; java -version 2>&1
          echo "== android sdk reachable?"; curl -s -o /dev/null -w "dl.google.com %{http_code}\n" https://dl.google.com/ || true
          true

      - name: Report probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          raw = open("probe.log", errors="replace").read()
          payload = {"body": "### SDK probe\n```\n" + raw[-55000:] + "\n```"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/commits/{os.environ['GH_SHA']}/comments",
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("posted")
          PYEOF
