name: CI probe

on:
  push:
    branches: ["ci-probe"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-build:
    name: Release build (diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release with full log
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          echo "exit=$?"
          tail -40 build.log

      - name: Post diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request

          raw = open("build.log", errors="replace").read() if os.path.exists("build.log") else "no build.log"
          lines = raw.splitlines()
          keep = [f"{i}: {l}" for i, l in enumerate(lines)
                  if re.search(r"(What went wrong|Caused by:|Execution failed|FAILED|error:|^e: |keystore|signing|SigningConfig|Missing|not found|No such)", l)]
          filtered = "\n".join(keep)[-30000:] or "(nothing matched)"
          tail = "\n".join(lines[-6000:])

          def post(body, label):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GH_REPO']}/commits/{os.environ['GH_SHA']}/comments",
                  data=json.dumps({"body": f"### {label}\n```\n{body}\n```"}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              urllib.request.urlopen(req)

          post(filtered, "Release build errors")
          post(tail, "Release build log tail")
          print("posted")
          PYEOF
